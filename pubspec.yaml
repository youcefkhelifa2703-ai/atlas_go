name: atlas_go
description: تطبيق ملاحة فضائية بخريطة الجزائر الكاملة أوفلاين بنمط Garmin
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  flutter_compass: ^0.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.7.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  vector_map_tiles: ^8.0.0
  vector_map_tiles_mbtiles: ^1.2.0
  mbtiles: ^0.4.2
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
